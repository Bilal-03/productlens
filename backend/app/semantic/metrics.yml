metrics:
  dau: {label: Daily Active Users, description: Distinct users with qualifying product activity in a day, kind: count, entity: user, format: integer, compiler: active_users, valid_dimensions: [channel, country, device, plan]}
  wau: {label: Weekly Active Users, description: Distinct users with qualifying product activity in seven days, kind: count, entity: user, format: integer, compiler: active_users, valid_dimensions: [channel, country, device, plan]}
  mau: {label: Monthly Active Users, description: Distinct users with qualifying product activity in thirty days, kind: count, entity: user, format: integer, compiler: active_users, valid_dimensions: [channel, country, device, plan]}
  stickiness: {label: DAU / MAU Stickiness, description: Daily active users divided by monthly active users, kind: rate, entity: user, format: percentage, compiler: stickiness, valid_dimensions: [channel, country, device, plan]}
  signup_conversion: {label: Signup Conversion, description: Landing sessions that reach signup completion, kind: rate, entity: session, format: percentage, compiler: event_conversion, numerator_event: signup_completed, denominator_event: landing_page_viewed, valid_dimensions: [channel, campaign, country, device, browser]}
  activation_rate: {label: Activation Rate, description: Signed-up users completing onboarding within seven days, kind: rate, entity: user, format: percentage, compiler: activation, numerator_event: onboarding_completed, denominator_event: signup_completed, valid_dimensions: [channel, campaign, country, device, plan, company_size]}
  checkout_conversion: {label: Checkout Conversion, description: Checkout sessions reaching successful payment, kind: rate, entity: session, format: percentage, compiler: event_conversion, numerator_event: payment_success, denominator_event: checkout_started, valid_dimensions: [channel, campaign, country, device, browser, plan, checkout_context]}
  payment_success_rate: {label: Payment Success Rate, description: Successful payment attempts divided by submitted attempts, kind: rate, entity: session, format: percentage, compiler: payment_success, valid_dimensions: [channel, country, device, browser, plan, checkout_context]}
  payment_failures: {label: Payment Failures, description: Distinct checkout sessions with a payment_failed event, kind: count, entity: session, format: integer, compiler: event_count, event_name: payment_failed, valid_dimensions: [channel, country, device, browser, plan, checkout_context]}
  mrr: {label: Monthly Recurring Revenue, description: Active recurring subscription value normalized to one month, kind: additive, entity: subscription, format: currency, compiler: mrr, valid_dimensions: [channel, country, plan, company_size]}
  arr: {label: Annual Recurring Revenue, description: Twelve times monthly recurring revenue, kind: additive, entity: subscription, format: currency, compiler: arr, valid_dimensions: [channel, country, plan, company_size]}
  arpu: {label: Average Revenue per User, description: Monthly recurring revenue divided by active paid users, kind: rate, entity: user, format: currency, compiler: arpu, valid_dimensions: [channel, country, plan, company_size]}
  revenue: {label: Net Revenue, description: Successful charges and renewals less refunds, kind: additive, entity: transaction, format: currency, compiler: revenue, valid_dimensions: [channel, country, plan, company_size, payment_method, customer_type, revenue_motion, failure_reason]}
  trial_to_paid: {label: Trial-to-Paid Conversion, description: Trials converting to paid within thirty days, kind: rate, entity: subscription, format: percentage, compiler: trial_to_paid, valid_dimensions: [channel, country, plan, company_size]}
  churn_rate: {label: Subscription Churn, description: Cancellations in period divided by subscriptions active at period start, kind: rate, entity: subscription, format: percentage, compiler: churn, valid_dimensions: [channel, country, plan, company_size]}
  d1_retention: {label: D1 Retention, description: Signup cohort active one day later, kind: rate, entity: user, format: percentage, compiler: retention, retention_day: 1, valid_dimensions: [channel, country, device, plan, cohort]}
  d7_retention: {label: D7 Retention, description: Signup cohort active seven days later, kind: rate, entity: user, format: percentage, compiler: retention, retention_day: 7, valid_dimensions: [channel, country, device, plan, cohort]}
  d30_retention: {label: D30 Retention, description: Signup cohort active thirty days later, kind: rate, entity: user, format: percentage, compiler: retention, retention_day: 30, valid_dimensions: [channel, country, device, plan, cohort]}
  weekly_retention: {label: Weekly Retention, description: Signup cohort members returning with qualifying activity during days seven through thirteen after signup, kind: rate, entity: user, format: percentage, compiler: retention_window, retention_window: weekly, valid_dimensions: [channel, country, device, plan, cohort]}
  monthly_retention: {label: Monthly Retention, description: Signup cohort members returning with qualifying activity during days thirty through fifty-nine after signup, kind: rate, entity: user, format: percentage, compiler: retention_window, retention_window: monthly, valid_dimensions: [channel, country, device, plan, cohort]}
  feature_adoption: {label: Feature Adoption, description: Active eligible users using a selected feature, kind: rate, entity: user, format: percentage, compiler: feature_adoption, valid_dimensions: [feature, channel, country, device, plan]}
  visitors: {label: Visitors, description: Distinct acquisition sessions with a landing page view, kind: count, entity: session, format: integer, compiler: acquisition, acquisition_stage: visitors, valid_dimensions: [channel, campaign, country, device, browser, plan, company_size]}
  signups: {label: Signups, description: Distinct users completing signup, kind: count, entity: user, format: integer, compiler: acquisition, acquisition_stage: signups, valid_dimensions: [channel, campaign, country, device, browser, plan, company_size]}
  activated_users: {label: Activated Users, description: Signed-up users completing onboarding within seven days, kind: count, entity: user, format: integer, compiler: acquisition, acquisition_stage: activated_users, valid_dimensions: [channel, campaign, country, device, browser, plan, company_size]}
  paid_users: {label: Paid Users, description: Users with a successful paid transaction or active paid subscription at period end, kind: count, entity: user, format: integer, compiler: acquisition, acquisition_stage: paid_users, valid_dimensions: [channel, campaign, country, device, browser, plan, company_size]}
  channel_conversion: {label: Channel Conversion, description: Signup sessions divided by acquisition visitors for each channel, kind: rate, entity: session, format: percentage, compiler: acquisition, acquisition_stage: channel_conversion, valid_dimensions: [channel, campaign, country, device, browser, plan, company_size]}
