services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: productlens
      POSTGRES_USER: productlens
      POSTGRES_PASSWORD: productlens
    ports:
      - "5432:5432"
    volumes:
      - productlens_pg:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U productlens -d productlens"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  productlens_pg:
