services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: productlens
      POSTGRES_USER: productlens
      POSTGRES_PASSWORD: productlens
    ports:
      - "5432:5432"
    volumes:
      - productlens_pg:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U productlens -d productlens"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DB_POOL_CLASS=queue
      - APP_DATABASE_URL=postgresql+psycopg://productlens:productlens@postgres:5432/productlens
      - ANALYTICS_DATABASE_URL=postgresql+psycopg://productlens:productlens@postgres:5432/productlens
      - FRONTEND_ORIGIN=http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  productlens_pg:
